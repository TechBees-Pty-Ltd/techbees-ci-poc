<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="160" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78350F"/>
      <stop offset="1" stop-color="#92400E"/>
    </linearGradient>
    <!-- Honeycomb pattern -->
    <pattern id="hc" x="0" y="0" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M10 0L20 5.77V17.32L10 23.09L0 17.32V5.77Z" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="0.6"/>
      <path d="M30 0L40 5.77V17.32L30 23.09L20 17.32V5.77Z" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="0.6"/>
      <path d="M20 11.55L30 17.32V28.87L20 34.64L10 28.87V17.32Z" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Vibrant amber/honey background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Honeycomb texture -->
  <rect width="400" height="400" fill="url(#hc)"/>

  <!-- Subtle glow behind bee -->
  <circle cx="200" cy="150" r="90" fill="white" fill-opacity="0.15"/>

  <!-- Bee icon (scaled up, centered at 200,150) -->
  <g transform="translate(200, 150) scale(4)">
    <!-- Hexagonal background -->
    <path d="M0 -21L15.6 -10.8V10.8L0 21L-15.6 10.8V-10.8Z" fill="url(#hexGrad)"/>

    <!-- Left wing -->
    <path d="M-4 -3L-13 -9L-15 -3L-5 2Z" fill="white" fill-opacity="0.8"/>
    <!-- Right wing -->
    <path d="M4 -3L13 -9L15 -3L5 2Z" fill="white" fill-opacity="0.8"/>

    <!-- Body -->
    <path d="M0 -7L4.5 -2L4 7L0 12L-4 7L-4.5 -2Z" fill="white" fill-opacity="0.95"/>

    <!-- Body stripes -->
    <line x1="-3.5" y1="0.5" x2="3.5" y2="0.5" stroke="#78350F" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>
    <line x1="-3" y1="4.5" x2="3" y2="4.5" stroke="#78350F" stroke-width="1.8" stroke-opacity="0.35" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="0" cy="-10" r="3.5" fill="white" fill-opacity="0.95"/>

    <!-- Antenna -->
    <line x1="-2" y1="-13" x2="-5" y2="-16.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <line x1="2" y1="-13" x2="5" y2="-16.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <circle cx="-5" cy="-16.5" r="1.4" fill="white" fill-opacity="0.9"/>
    <circle cx="5" cy="-16.5" r="1.4" fill="white" fill-opacity="0.9"/>
  </g>

  <!-- TechBees text -->
  <text x="200" y="325" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="60" fill="#78350F">TechBees</text>

  <!-- Tagline -->
  <text x="200" y="365" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#92400E" fill-opacity="0.8">Software Consulting</text>
</svg>
